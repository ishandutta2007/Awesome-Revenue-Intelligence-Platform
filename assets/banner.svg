<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a855f7;#38bdf8;#60a5fa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#60a5fa;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%% { opacity: 0.3; }
      50%% { opacity: 0.9; }
      100%% { opacity: 0.3; }
    }
    @keyframes float {
      0%% { transform: translateY(0px); }
      50%% { transform: translateY(-6px); }
      100%% { transform: translateY(0px); }
    }
    @keyframes scan {
      0%% { transform: translateX(0); opacity: 0; }
      20%% { opacity: 1; }
      80%% { opacity: 1; }
      100%% { transform: translateX(260px); opacity: 0; }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    .pulse-dot { animation: pulse 3s infinite ease-in-out; }
    .floating-card { animation: float 5s infinite ease-in-out; }
    .scan-beam { animation: scan 4s infinite linear; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subdued Background Grid -->
  <g opacity="0.6">
    <line x1="60" y1="70" x2="1140" y2="70" class="grid-line" />
    <line x1="60" y1="130" x2="1140" y2="130" class="grid-line" />
    <line x1="60" y1="190" x2="1140" y2="190" class="grid-line" />
    <line x1="60" y1="250" x2="1140" y2="250" class="grid-line" />
    <line x1="60" y1="310" x2="1140" y2="310" class="grid-line" />
    <line x1="240" y1="40" x2="240" y2="320" class="grid-line" />
    <line x1="480" y1="40" x2="480" y2="320" class="grid-line" />
    <line x1="720" y1="40" x2="720" y2="320" class="grid-line" />
    <line x1="960" y1="40" x2="960" y2="320" class="grid-line" />
  </g>

  <!-- Left Side: Title & Badges -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="pulse-dot"/>
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1">REVENUE INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" filter="url(#softGlow)" letter-spacing="-0.5">
      Awesome Revenue Intelligence
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Pipeline Visibility • AI Forecasting • Conversation Intelligence • Deal Risk Scoring
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#c7d2fe">📈 AI Forecasts</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="165" height="34" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text x="154" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#bae6fd">🎙️ Call Intelligence</text>

      <!-- Pill 3 -->
      <rect x="315" y="0" width="155" height="34" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="329" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#a7f3d0">⚡ Deal Health AI</text>

      <!-- Pill 4 -->
      <rect x="480" y="0" width="150" height="34" rx="8" fill="#3b0764" stroke="#9333ea" stroke-width="1"/>
      <text x="494" y="22" font-family="sans-serif" font-size="13" font-weight="500" fill="#e9d5ff">🔄 RevOps Sync</text>
    </g>

    <!-- Bottom Stat highlights -->
    <g transform="translate(0, 280)">
      <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">CURATED SAAS ECOSYSTEM &amp; PRODUCTION OPEN-SOURCE PLATFORMS</text>
    </g>
  </g>

  <!-- Right Side: Revenue Analytics Dynamic Mockup Card -->
  <g transform="translate(780, 50)" class="floating-card">
    <!-- Card Frame -->
    <rect width="360" height="260" rx="16" fill="#131c31" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Card Header -->
    <text x="24" y="36" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Quarterly Forecast vs Actual</text>
    <rect x="260" y="20" width="76" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="272" y="35" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">+28.4% YoY</text>

    <!-- Metrics row -->
    <g transform="translate(24, 60)">
      <text x="0" y="14" font-family="sans-serif" font-size="24" font-weight="800" fill="#ffffff">$14.2M</text>
      <text x="0" y="30" font-family="sans-serif" font-size="11" fill="#94a3b8">Weighted Pipeline</text>

      <text x="160" y="14" font-family="sans-serif" font-size="24" font-weight="800" fill="#38bdf8">94.8%</text>
      <text x="160" y="30" font-family="sans-serif" font-size="11" fill="#94a3b8">Forecast Accuracy</text>
    </g>

    <!-- Chart Bars & Trends -->
    <g transform="translate(24, 115)">
      <!-- Background trend area -->
      <path d="M 0,90 Q 60,60 120,70 T 240,30 T 312,10 L 312,110 L 0,110 Z" fill="url(#chartGrad)"/>
      <path d="M 0,90 Q 60,60 120,70 T 240,30 T 312,10" fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#softGlow)"/>

      <!-- Bar items -->
      <rect x="20" y="60" width="18" height="50" rx="4" fill="url(#barGrad1)"/>
      <rect x="70" y="45" width="18" height="65" rx="4" fill="url(#barGrad2)"/>
      <rect x="120" y="55" width="18" height="55" rx="4" fill="url(#barGrad1)"/>
      <rect x="170" y="35" width="18" height="75" rx="4" fill="url(#barGrad3)"/>
      <rect x="220" y="25" width="18" height="85" rx="4" fill="url(#barGrad2)"/>
      <rect x="270" y="10" width="18" height="100" rx="4" fill="url(#barGrad3)"/>

      <!-- Glowing AI prediction node -->
      <circle cx="312" cy="10" r="6" fill="#4ade80" filter="url(#softGlow)"/>
      <circle cx="312" cy="10" r="12" fill="#4ade80" fill-opacity="0.3" class="pulse-dot"/>
    </g>
  </g>
</svg>